repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=25000']
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
  # Keep this rev in sync with the pinned `uvx ruff@<version>` in
  # .github/workflows/ci.yml, so local hooks and CI never disagree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        types_or: [python, pyi, jupyter]
        args:
        - --fix
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.16
    hooks:
      - id: validate-pyproject
  # mypy over the package (config in pyproject.toml: files = ["panelary"]).
  # Opt-in, not automatic: mypy is still ~1040 errors from clean, so a blocking
  # commit hook would be red on every commit and would only teach contributors
  # to reach for `--no-verify`, taking ruff down with it. CI ratchets the count
  # instead (MYPY_BASELINE in .github/workflows/ci.yml) -- that is the gate.
  # Run it deliberately with:
  #     pre-commit run --hook-stage manual mypy --all-files
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        files: ^panelary/
        pass_filenames: false
        stages: [manual]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.24.0
    hooks:
      - id: commitizen-branch
        stages: [push]
