[build-system]
requires = ["maturin>=1.3.2,<2"]
build-backend = "maturin"

[project]
name = "polars_features"
# NOTE: Pinned for now. maturin can later read the version from Cargo.toml
# (`version = "..."` under [tool.maturin]) or derive it from git tags at
# release time -- that dynamic-versioning setup is handled elsewhere.
version = "0.3.0"
description = "Leak-safe, Rust-fast feature engineering and ML for panel data, built on Polars."
requires-python = ">=3.10"
authors = [{ name = "Sov.ai", email = "research@sov.ai" }]
readme = "README.md"
keywords = [
  "polars",
  "panel-data",
  "feature-engineering",
  "time-series",
  "finance",
  "quant",
  "machine-learning",
  "rust",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Intended Audience :: Financial and Insurance Industry",
  "Typing :: Typed",
]
dependencies = [
  # NOTE: `flaml`, `holidays`, `scikit-learn`, `scipy`, and `tqdm` are kept here
  # for now, but a future (breaking) release will slim the hard dependency set --
  # each is already available behind a named extra below (forecasting/seasonality/
  # ml/scipy/progress) and imported lazily via `polars_features._deps.require`.
  # `cloudpickle` was dropped in favor of stdlib `pickle` (see CHANGELOG).
  "flaml>=2.0.2",
  "holidays",
  "numpy",
  "polars>=1.0.0",
  "scikit-learn>=1.2.2",
  "scipy",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/sovai-research/polars-features"
Repository = "https://github.com/sovai-research/polars-features"
Documentation = "https://github.com/sovai-research/polars-features"
Changelog = "https://github.com/sovai-research/polars-features/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Extra names below intentionally mirror `polars_features._deps._MODULE_TO_EXTRA`
# so the `require(...)` install hints ("pip install 'polars-features[<extra>]'")
# always resolve to a real extra.

# --- classical ML: sklearn-backed estimators, selection, reduction, clustering.
# Everything in models/select/reduce/cluster imports sklearn lazily. ---
ml = ["scikit-learn>=1.2.2"]
# --- scientific kernels used by feature_extractors/catch22/evaluation/metrics. ---
scipy = ["scipy"]
# --- progress bars (forecasting loops); code degrades to a no-op without it. ---
progress = ["tqdm"]
# --- seasonality calendar/holiday effects (fourier terms stay dependency-free). ---
seasonality = ["holidays"]
# --- legacy autoregressive forecasting (functime-derived): FLAML `tune` for HPO. ---
forecasting = ["flaml>=2.0.2", "tqdm"]
# --- FLAML AutoML path (flaml_lightgbm): needs flaml[automl] + a booster. ---
automl = ["flaml[automl]>=2.0.2", "lightgbm"]
# --- gradient-boosting back-ends (each optional, additive) for forecasting/models. ---
lightgbm = ["lightgbm"]
catboost = ["catboost"]
xgboost = ["xgboost"]
# --- approximate-nearest-neighbor reduction (forecasting.lance -> `import lance`). ---
ann = ["pylance"]
# LLM-assisted features. The current code targets the OpenAI SDK; anthropic is
# included as the recommended provider going forward.
llm = ["openai", "anthropic", "tiktoken", "tenacity"]
# GPU acceleration. Polars exposes its GPU engine via the collect engine
# (`.collect(engine="gpu")`), which pulls in the cudf-polars backend.
gpu = ["cudf-polars-cu12"]
# Plotting utilities (see polars_features/plotting.py -> plotly).
viz = ["plotly"]
# CAFE imputation backend (cafe_impute / CafeImputer). MIT, Sov.ai.
cafe = ["cafe-impute>=0.1"]
# Non-linear dimensionality reduction (reduce.PanelUMAP). PCA/SVD/FA/NMF use the
# `ml` extra's scikit-learn; only UMAP needs this extra.
dimreduce = ["umap-learn>=0.5"]
# Path-signature transforms. RESERVED / UNUSED: no code imports `iisignature`
# yet, and signatory / iisignature licenses must be verified before enabling
# this as a hard dependency. Kept only because `_deps` maps it to this name.
signatures = ["iisignature"]
# Batteries-included bundle: the common heavy deps that reproduce the old
# effective feature set (minus GPU / niche back-ends). Restores the pre-slim
# experience for users who want `pip install` to "just work".
recommended = ["polars_features[ml,scipy,seasonality,cafe]"]
# The kitchen sink: every real optional feature set (self-referential extras
# require pip>=21.2). Excludes the reserved/unused `signatures` extra.
all = [
  "polars_features[ml,scipy,progress,seasonality,forecasting,automl,lightgbm,catboost,xgboost,ann,llm,gpu,viz,cafe,dimreduce]",
]
# Development / CI tooling.
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0",
  "hypothesis>=6.0",
  "mypy>=1.8",
  "pre-commit>=3.5",
  "maturin>=1.3.2,<2",
]

[tool.maturin]
module-name = "polars_features._polars_features_rust"
features = ["pyo3/extension-module"]
exclude = ["docs/**", "data/**", "tests/**"]
# Ship the typing marker so downstream type checkers treat the package as typed.
include = ["polars_features/py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb", "docs/notebooks/**"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "W",   # pycodestyle warnings
]
ignore = [
  "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/**" = ["B", "F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["polars_features"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "benchmark: marks tests as benchmarks",
  "multivariate: marks tests that exercise multivariate forecasting",
]

[tool.mypy]
# `ty` (astral) is the preferred type checker going forward, but mypy config is
# kept as the portable fallback that runs everywhere today.
python_version = "3.10"
files = ["polars_features"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The compiled Rust extension module has no stubs.
module = [
  "polars_features._polars_features_rust",
  "polars_features._plotting",
]
ignore_missing_imports = true

[tool.hypothesis]
# Disable per-example deadlines; Rust-backed ops can have variable warm-up cost.
deadline = 0
