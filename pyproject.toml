[build-system]
requires = ["maturin>=1.3.2,<2"]
build-backend = "maturin"

[project]
name = "polars_features"
version = "0.1.0"
description = "Time-series machine learning at scale."
requires-python = ">=3.8"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
dependencies = [
  "cloudpickle",
  "flaml>=2.0.2",
  "holidays",
  "numpy",
  "polars>=1.0.0",
  "scikit-learn>=1.2.2",
  "scipy",
  "tqdm",
  "typing-extensions; python_version < '3.10'"
]

[tool.maturin]
module-name = "polars_features._polars_features_rust"
features = ["pyo3/extension-module"]
exclude = ["docs/**", "data/**", "tests/**"]
