name: Release

# Build the single universal wheel (`py3-none-any`) + sdist and publish to PyPI
# via Trusted Publishing (OIDC, no API tokens).
#
# 0.4.0 removed the Rust extension, so there is no OS/arch fan-out and no
# abi3 audit any more: one pure-Python wheel serves every platform and every
# supported Python. `tests/test_wheel_guardrails.py` enforces that property in
# CI, and the build job re-asserts it here before anything is published.
#
# ===========================================================================
# ONE-TIME MAINTAINER SETUP (Trusted Publishing / OIDC)
# ---------------------------------------------------------------------------
# 1. PyPI:  https://pypi.org/manage/account/publishing/
#      Add a "pending publisher" (or, once the project exists, a publisher)
#      with:
#         PyPI Project Name : panelary
#         Owner             : <your GitHub org/user>
#         Repository name   : panelary
#         Workflow name     : release.yml
#         Environment name  : pypi
# 2. TestPyPI: repeat the same at https://test.pypi.org/manage/account/publishing/
#         Environment name  : testpypi
# 3. GitHub:  Settings -> Environments -> create `pypi` and `testpypi`.
#      Optionally add required reviewers / branch restrictions to `pypi`.
# No usernames, passwords, or API tokens are stored anywhere. The
# `id-token: write` permission below lets PyPI verify the OIDC identity.
# ===========================================================================

on:
  push:
    tags:
      - "v*"
  # Manual trigger -> defaults to a TestPyPI dry-run (see publish jobs).
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the universal wheel + sdist. Pure Python: one artifact set, no matrix.
  # ---------------------------------------------------------------------------
  build:
    name: Build universal wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: |
          uv venv
          uv pip install build
          uv run python -m build

      - name: Verify the distribution is universal and pure-Python
        run: |
          ls -l dist/
          test "$(ls dist/*.whl | wc -l)" -eq 1
          ls dist/*.whl | grep -q 'py3-none-any\.whl'
          # A compiled object in the wheel would break the universal promise.
          if unzip -l dist/*.whl | grep -qE '\.(so|pyd|dylib|dll)$'; then
            echo "::error::wheel contains a compiled artifact"; exit 1
          fi

      - name: Check metadata with twine
        run: |
          uv pip install twine
          uv run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # TestPyPI dry-run.
  # Runs on workflow_dispatch when publish_target == testpypi, or for any
  # prerelease tag (e.g. v1.2.3rc1, v1.2.3-alpha.1, ...-beta...).
  # ---------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI (dry-run)
    needs: [build]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi') ||
      (github.event_name == 'push' &&
        (contains(github.ref_name, 'rc') ||
         contains(github.ref_name, 'alpha') ||
         contains(github.ref_name, 'beta')))
    environment:
      name: testpypi
      url: https://test.pypi.org/p/panelary
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Allow re-runs against an already-uploaded version on TestPyPI.
          skip-existing: true
          # PEP 740 digital attestations, signed with the same OIDC identity
          # Trusted Publishing already uses. Default is true; stated explicitly
          # so a future default flip cannot silently drop provenance.
          attestations: true

  # ---------------------------------------------------------------------------
  # Real PyPI publish.
  # Runs only for final (non-prerelease) version tags, or an explicit
  # workflow_dispatch with publish_target == pypi.
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi') ||
      (github.event_name == 'push' &&
        !contains(github.ref_name, 'rc') &&
        !contains(github.ref_name, 'alpha') &&
        !contains(github.ref_name, 'beta'))
    environment:
      name: pypi
      url: https://pypi.org/p/panelary
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` -> Trusted Publishing via OIDC is used automatically.
        with:
          # PEP 740 digital attestations, signed with the same OIDC identity
          # Trusted Publishing already uses. Default is true; stated explicitly
          # so a future default flip cannot silently drop provenance.
          attestations: true
