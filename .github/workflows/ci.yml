name: CI

# Continuous integration for PanelKit (polars_features).
#
# 0.4.0 dropped the Rust extension: the distribution is pure Python and ships a
# single universal `py3-none-any` wheel, so there is no toolchain to install and
# no per-platform build step. What CI defends instead is the *light core*:
#
#   * lint / format / type-check
#   * the normal test matrix (OS x Python) on the `dev` + `recommended` install
#   * an **extras matrix** proving the suite behaves on `[]`, `[recommended]`
#     and `[all]` -- i.e. the bare core really works and the extras really do
#     light their features up
#   * the packaging guardrails (import hygiene, dependency drift, wheel shape
#     and size), which are ordinary pytest files so they also run locally

on:
  pull_request:
  push:
    branches:
      - main
      - Wenda

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format (ruff). Fast, runs on a single runner.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `uv pip install --system` cannot be used here: the hosted runner's
      # system interpreter is PEP 668 externally-managed, so it fails with
      # "The interpreter at /usr is externally managed". `uvx` runs ruff from
      # an ephemeral, cached environment instead -- no venv, no system writes.
      #
      # The version is pinned and MUST match `.pre-commit-config.yaml`'s
      # ruff-pre-commit rev, so a contributor's hooks and CI never disagree.
      - name: ruff check
        run: uvx ruff@0.15.10 check .

      - name: ruff format --check
        run: uvx ruff@0.15.10 format --check .

  # ---------------------------------------------------------------------------
  # Type-check (mypy). Blocking. mypy config (files = ["polars_features"])
  # lives in pyproject.toml.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Create venv & install (dev + recommended)
        run: |
          uv venv
          uv pip install -e ".[dev,recommended]"

      - name: mypy
        run: uv run mypy polars_features

  # ---------------------------------------------------------------------------
  # Main test matrix. Pure-Python install: no compiler, no toolchain.
  # ---------------------------------------------------------------------------
  test:
    name: Test py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv & install (dev + recommended + test-only deps)
        # pandas is a *test-only* dependency (tests/conftest.py builds pandas
        # fixtures and benchmarks compare against it). It must never become a
        # runtime dependency -- tests/test_import_hygiene.py enforces that.
        run: |
          uv venv
          uv pip install -e ".[dev,recommended]" pandas build

      - name: Run tests
        # The 40-minute forecasting suite runs nightly, not per-PR.
        run: uv run pytest -q --ignore=tests/test_forecasting.py

  # ---------------------------------------------------------------------------
  # Extras matrix (Wave 4): prove the bare core works and the extras light up.
  #
  #   []             -> numpy + polars only. Runs the subset of the suite that
  #                     does not need an optional dependency (see the ignore
  #                     list below); every ignored file is ignored because it
  #                     imports an sklearn/scipy/holidays-backed module at
  #                     module scope. Shrinking that list (by adding
  #                     `pytest.importorskip` guards) is tracked work.
  #   [recommended]  -> ml + scipy + seasonality + cafe: the batteries-included
  #                     experience. Full suite must pass.
  #   [all]          -> every optional feature set. Advisory only: `all` pulls
  #                     `gpu` (cudf-polars-cu12) and `ann` (pylance), which are
  #                     large and not installable on every hosted runner, so the
  #                     job reports rather than blocks.
  # ---------------------------------------------------------------------------
  extras-matrix:
    name: Extras ${{ matrix.variant.label }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.variant.advisory }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - label: "bare core []"
            spec: "."
            advisory: false
          - label: "[recommended]"
            spec: ".[recommended]"
            advisory: false
          - label: "[all]"
            spec: ".[all]"
            advisory: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv & install ${{ matrix.variant.label }}
        # Test tooling (pytest/hypothesis/pandas/build) is installed in every
        # variant; it is deliberately NOT part of the package's dependencies.
        run: |
          uv venv
          uv pip install "${{ matrix.variant.spec }}" pytest hypothesis pandas build

      - name: Guardrails (import hygiene, dependency drift, wheel shape)
        run: |
          uv run pytest -q \
            tests/test_import_hygiene.py \
            tests/test_dependency_drift.py \
            tests/test_wheel_guardrails.py

      - name: Show optional-feature availability
        # Prints which optional modules resolved in this variant, so the log
        # itself is evidence that `[recommended]`/`[all]` really light up.
        run: uv run python benchmarks/show_capabilities.py

      - name: Run suite (bare core subset)
        if: matrix.variant.label == 'bare core []'
        # Each ignore is an optional-dependency import at module scope.
        run: |
          uv run pytest -q \
            --ignore=tests/test_forecasting.py \
            --ignore=tests/test_benchmarks.py \
            --ignore=tests/test_evaluation.py \
            --ignore=tests/test_mda_permute.py \
            --ignore=tests/test_models.py \
            --ignore=tests/test_plotting.py \
            --ignore=tests/test_preprocessing.py \
            --ignore=tests/test_reduce.py \
            --ignore=tests/test_select.py \
            --ignore=tests/test_select_unsup.py \
            --ignore=tests/test_reduce_factor_leakage.py \
            --ignore=tests/test_cross_validation.py \
            --ignore=tests/test_calendar.py \
            --ignore=tests/test_cluster.py \
            --ignore=tests/test_forecasting_light.py

      - name: Run suite (with extras)
        if: matrix.variant.label != 'bare core []'
        run: uv run pytest -q --ignore=tests/test_forecasting.py

  # ---------------------------------------------------------------------------
  # Packaging: build the universal wheel + sdist once and archive them, so the
  # artifacts a release would publish are exercised on every PR.
  # ---------------------------------------------------------------------------
  package:
    name: Build universal wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: |
          uv venv
          uv pip install build
          uv run python -m build

      - name: Assert the wheel is universal
        run: |
          ls -l dist/
          test "$(ls dist/*.whl | wc -l)" -eq 1
          ls dist/*.whl | grep -q 'py3-none-any\.whl'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # Speed smoke test. Runs the pandas-comparison harness so an accidental
  # order-of-magnitude regression in the golden-path operations is visible in
  # the log. Advisory (hosted-runner timings are noisy), not a gate.
  # ---------------------------------------------------------------------------
  benchmarks:
    name: Speed harness (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install (recommended + pandas)
        run: |
          uv venv
          uv pip install -e ".[recommended]" pandas

      - name: PanelKit vs pandas
        run: uv run python benchmarks/bench_vs_pandas.py

      - name: Hotspot profile (small sizes)
        run: uv run python benchmarks/bench_hotspots.py --rows 200000
