name: CI

# Continuous integration for PanelKit (polars_features).
# Runs lint/format, type-check, a build+test matrix, and a CodSpeed
# benchmark-regression gate.

on:
  pull_request:
  push:
    branches:
      - main
      - Wenda

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the toolchain used everywhere so jobs stay reproducible.
  RUST_TOOLCHAIN: stable
  # Keep cargo output quiet and fail fast.
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format (ruff). Fast, runs on a single runner.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ruff
        # ruff lives in the `dev` extra; install just the tooling we need.
        run: uv pip install --system "ruff>=0.8.0"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Type-check (mypy). Blocking. mypy config (files = ["polars_features"])
  # lives in pyproject.toml.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: typecheck

      - name: Create venv & install (with dev extra)
        # Building the extension gives mypy the real package layout to inspect.
        # ignore_missing_imports is set in pyproject for the compiled module.
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: mypy
        run: uv run mypy polars_features

  # ---------------------------------------------------------------------------
  # Build (maturin develop) + test matrix.
  # ---------------------------------------------------------------------------
  test:
    name: Test py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache per OS/py to avoid cross-contamination.
          key: test-${{ matrix.os }}-py${{ matrix.python-version }}

      - name: Create venv
        run: uv venv

      - name: Build Rust extension + install (with dev extra)
        # `maturin develop` compiles the pyo3-polars crate and installs the
        # extension into the active venv in editable/dev mode.
        run: |
          uv pip install -e ".[dev]"
          uv run maturin develop --release

      - name: Run tests
        run: uv run pytest -q

  # ---------------------------------------------------------------------------
  # CodSpeed benchmark-regression gate.
  #
  # NOTE: This runs `pytest --codspeed`, which requires benchmarks marked with
  # the `@pytest.mark.benchmark`/`pytest-codspeed` fixtures. The repo currently
  # ships tests/test_benchmarks.py but there is no dedicated benchmarks/ dir;
  # if no codspeed-compatible benchmarks are discovered the step is a no-op and
  # the job is allowed to pass (continue-on-error) so it acts as a placeholder
  # until real benches land.
  #
  # One-time setup: install the CodSpeed GitHub App on the repo and (for private
  # repos) add CODSPEED_TOKEN as a repo secret. See https://codspeed.io/docs
  # ---------------------------------------------------------------------------
  benchmarks:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    # Placeholder-friendly: do not fail CI if there are no benches yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: benchmarks

      - name: Build extension + install (dev + pytest-codspeed)
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install pytest-codspeed
          uv run maturin develop --release

      - name: Run benchmarks under CodSpeed
        uses: CodSpeedHQ/action@v4
        with:
          # Token only required for private repos; harmless if unset on public.
          token: ${{ secrets.CODSPEED_TOKEN }}
          # `|| true` keeps the placeholder green when no benches are collected.
          run: uv run pytest --codspeed || true
