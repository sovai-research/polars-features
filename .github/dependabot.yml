version: 2
updates:
  # Keep GitHub Actions pinned to fresh tags (supply-chain hygiene).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions

  # NOTE: the `cargo` ecosystem was removed in 0.4.0 along with the Rust
  # extension. There is no Cargo.toml in the tree any more, so every scheduled
  # cargo run failed ("Dependabot Updates" / cargo, see the Actions tab).

  # Python dependencies (pyproject.toml).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
