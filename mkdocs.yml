site_name: PanelKit
site_description: "Leak-safe, fast feature engineering and ML for panel data, built on Polars. Built on the foundations of functime (Apache-2.0, actively maintained)."
site_url: https://sovai-research.github.io/polars-features/
repo_url: https://github.com/sovai-research/polars-features
repo_name: sovai-research/polars-features

theme:
  name: "material"
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  favicon: img/logo_dark.png
  logo: img/logo.png
  palette:
    primary: black
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.expand

plugins:
  - search:
      lang: en
  - mkdocs-jupyter:
      include: ["*.ipynb"]
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_bases: false
  # If available, enable an llms.txt plugin to generate an LLM-friendly site
  # summary for coding agents (see https://llmstxt.org). A hand-written
  # `llms.txt` already lives at the repo root.
  # - mkdocs-llmstxt

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts:
    - Panel data: concepts/panel-data.md
    - The two-tier API: concepts/two-tier-api.md
    - Leak-safety: concepts/leak-safety.md
  - Leakage & Correctness: leakage.md
  - User Guide:
    - Feature Engineering: user-guide/features.md
    - Imputation (CAFE): user-guide/imputation.md
    - Labeling: user-guide/labeling.md
    - Feature Selection: user-guide/selection.md
    - Panel ML Models: user-guide/models.md
    - Validation: user-guide/validation.md
    - Preprocessing: user-guide/preprocessing.md
    - Forecasting: user-guide/forecasting.md
    - Seasonality: user-guide/seasonality.md
    - Feature Extraction (legacy): user-guide/feature-extraction.md
  - Benchmarks:
    - PanelKit vs pandas: benchmarks/vs_pandas.md
  - Roadmap: roadmap.md
  - Developer Guides:
    - Custom Forecasters and Transformers: developer-guide/develop.md
    - Contributing: developer-guide/contributing.md
  - Tutorials:
    - Preprocessing: notebooks/preprocessing.ipynb
    - Feature Extraction: notebooks/benchmarks.ipynb
    - Forecast Evaluation: notebooks/evaluation.ipynb
    - LLM Analysis: notebooks/llm.ipynb
  - API Reference:
    - feature_extraction: api-reference/feature-extractors.md
    - catch22: api-reference/catch22.md
    - preprocessing: api-reference/preprocessing.md
    - imputation: api-reference/imputation.md
    - labeling: api-reference/labeling.md
    - factor: api-reference/factor.md
    - selection: api-reference/selection.md
    - reduce: api-reference/reduce.md
    - cluster: api-reference/cluster.md
    - models: api-reference/models.md
    - cross_validation: api-reference/cross-validation.md
    - leak verifiers: api-reference/testing.md
    - evaluation: api-reference/evaluation.md
    - metrics: api-reference/metrics.md
    - multi_objective: api-reference/multi-objective.md
    - forecasting: api-reference/forecasting.md
    - seasonality: api-reference/seasonality.md
    - offsets: api-reference/offsets.md
    - plotting: api-reference/plotting.md

extra:
  analytics:
    provider: google
    property: G-CYGTL9FJ4R
